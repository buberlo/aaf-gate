name: Feature or adapter proposal
description: Suggest a feature, runtime adapter, or substantive design change
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Outline the idea before large implementation work. Adapters should describe hook points and how policy classes map.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Behavior, scope, and non-goals
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this